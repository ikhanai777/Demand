[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-scanner"
version = "1.0.0"
description = "Find and score pain points in any niche from Reddit, Hacker News, Google Trends, YouTube, TikTok, app stores and more."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
play = ["google-play-scraper>=1.2"]
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=7"]

[project.scripts]
demand-scanner = "demand_scanner.cli:main"
demand-scanner-mcp = "demand_scanner.mcp_server:main"

[tool.setuptools.packages.find]
include = ["demand_scanner*"]

[tool.setuptools.package-data]
demand_scanner = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
